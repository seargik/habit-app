name: Phase 1 safety tests

on:
  push:
    branches:
      - phase1-dated-definitions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check migration-v4.js
          node --check legacy-carryover-v4.js
          node --check general-guard-v4.js
          node --check metric-visibility-v4.js
          node --check app-v4.js
          node --check sw.js

      - name: Migration safety tests
        run: node tests/migration-v4.test.js

      - name: General guard tests
        run: node tests/general-guard-v4.test.js

      - name: Legacy carryover tests
        run: node tests/legacy-carryover-v4.test.js

      - name: Metric visibility tests
        run: node tests/metric-visibility-v4.test.js
